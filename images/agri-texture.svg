<?xml version="1.0" encoding="UTF-8"?>
<!--
  Badshah Property - real-estate outline texture (dark motifs).

  Tileable 640x640. Large, sparse line-art: farmhouse, land parcel with corner
  markers, barn and silo, survey dimension, plot pin, apartment block, fencing
  and trees. Every shape sits clear of the tile edges so the repeat is seamless.

  Opacity is deliberately low (0.055) because these motifs are much larger than
  the previous pattern and therefore lay down more ink per tile. Keeping the
  value inside the SVG means the background never dims the page content.

  Light-motif counterpart for dark sections: agri-texture-light.svg
-->
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <g fill="none" stroke="#2d5016" stroke-opacity="0.055" stroke-width="2.4"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- Farmhouse -->
    <g transform="translate(40 70)">
      <path d="M0 55 L75 5 L150 55"/>
      <path d="M16 54 L16 115 L134 115 L134 54"/>
      <path d="M64 115 L64 80 L86 80 L86 115"/>
      <path d="M30 70 L50 70 L50 88 L30 88 Z"/>
      <path d="M100 70 L120 70 L120 88 L100 88 Z"/>
      <path d="M110 31 L110 13 L122 13 L122 39"/>
    </g>

    <!-- Land parcel with survey corner markers and a dividing line -->
    <g transform="translate(255 40)">
      <path d="M0 22 L190 0 L200 118 L10 140 Z" stroke-dasharray="14 9"/>
      <circle cx="0" cy="22" r="4.5"/>
      <circle cx="190" cy="0" r="4.5"/>
      <circle cx="200" cy="118" r="4.5"/>
      <circle cx="10" cy="140" r="4.5"/>
      <path d="M98 11 L104 129" stroke-dasharray="8 8"/>
    </g>

    <!-- Plot pin -->
    <g transform="translate(500 60)">
      <path d="M26 78 C26 78 4 48 4 30 A22 22 0 0 1 48 30 C48 48 26 78 26 78 Z"/>
      <circle cx="26" cy="29" r="8"/>
    </g>

    <!-- Barn with silo -->
    <g transform="translate(415 215)">
      <path d="M18 52 L34 25 L104 14 L120 44"/>
      <path d="M18 52 L18 120 L120 120 L120 44"/>
      <path d="M54 120 L54 74 L86 74 L86 120"/>
      <path d="M54 74 L86 120 M86 74 L54 120"/>
      <path d="M134 120 L134 46 A16 16 0 0 1 166 46 L166 120"/>
      <path d="M134 62 L166 62 M134 84 L166 84"/>
    </g>

    <!-- Survey dimension line -->
    <g transform="translate(45 255)">
      <path d="M4 30 L176 30"/>
      <path d="M4 18 L4 42 M176 18 L176 42"/>
      <path d="M4 30 L20 23 M4 30 L20 37"/>
      <path d="M176 30 L160 23 M176 30 L160 37"/>
    </g>

    <!-- Tree -->
    <g transform="translate(255 230)">
      <path d="M29 90 L29 54"/>
      <path d="M29 54 C6 54 0 34 10 22 C12 6 34 0 44 10 C58 12 62 34 50 46 C46 52 38 54 29 54 Z"/>
      <path d="M29 68 L16 58 M29 74 L42 62"/>
    </g>

    <!-- Apartment block -->
    <g transform="translate(45 395)">
      <path d="M0 150 L0 30 L80 30 L80 150"/>
      <path d="M-6 30 L86 30"/>
      <path d="M0 62 L80 62 M0 94 L80 94 M0 122 L80 122"/>
      <path d="M16 40 L30 40 L30 54 L16 54 Z"/>
      <path d="M50 40 L64 40 L64 54 L50 54 Z"/>
      <path d="M16 72 L30 72 L30 86 L16 86 Z"/>
      <path d="M50 72 L64 72 L64 86 L50 86 Z"/>
      <path d="M32 122 L32 150 L48 150 L48 122"/>
    </g>

    <!-- Fencing -->
    <g transform="translate(215 470)">
      <path d="M0 26 L150 26 M0 46 L150 46"/>
      <path d="M12 12 L12 66 M50 12 L50 66 M88 12 L88 66 M126 12 L126 66"/>
    </g>

    <!-- Second tree, smaller -->
    <g transform="translate(545 430)">
      <path d="M28 88 L28 56"/>
      <path d="M28 56 C8 56 2 38 11 26 C14 11 33 6 42 15 C54 18 57 38 47 48 C43 54 36 56 28 56 Z"/>
    </g>
  </g>
</svg>
